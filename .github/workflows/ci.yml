name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Rodar testes
        run: pytest backend/tests/

      - name: Criar .env para validação
        run: |
          echo "APP_ENV=development" >> .env
          echo "APP_PORT=8000" >> .env
          echo "POSTGRES_USER=biblioteca_user" >> .env
          echo "POSTGRES_PASSWORD=biblioteca_pass" >> .env
          echo "POSTGRES_DB=biblioteca_db" >> .env
          echo "DATABASE_URL=postgresql://biblioteca_user:biblioteca_pass@db:5432/biblioteca_db" >> .env

      - name: Validar Docker Compose
        run: docker compose config

      - name: Build da imagem do backend
        run: docker build -t pbl-backend ./backend